<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e53935">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FAQ">
<title>FAQ Document</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f7f9fa;color:#222;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(420px,100%);background:#fff;border-radius:24px;padding:34px 26px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.icon{width:104px;height:104px;border-radius:24px;margin:0 auto 20px;display:block}
h1{font-size:25px;margin:0 0 10px}
p{font-size:15px;line-height:1.55;color:#666;margin:0 auto 24px;max-width:330px}
.btn{display:block;background:#e53935;color:#fff;text-decoration:none;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700}
.small{margin-top:18px;font-size:12px;color:#999}
</style>
</head>
<body>
<main class="card">
<img class="icon" src="./icon-192.png" alt="FAQ">
<h1>FAQ Document</h1>
<p>Your Google Document is ready. Tap below to open it.</p>
<a class="btn" href="https://docs.google.com/document/d/1S45W0eeV3lBunJOKlvEaHh_CecS7swXFApMTvVD5HSA/edit?tab=t.0" target="_blank" rel="noopener">Open FAQ Document</a>
<div class="small">Installed app • Quick access</div>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
